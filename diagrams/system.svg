<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sys-title sys-desc">
  <title id="sys-title">Ferridis — System diagram v0.6</title>
  <desc id="sys-desc">System architecture showing three AI panels (Claude Code, GitHub Copilot Chat, Zed AI) flowing through editor integrations and shim binaries, converging at ferridis-client, crossing one HTTPS wire boundary to the adapter layer, with ferridis-core as the shared foundation.</desc>

