<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">Ferridis — Six-layer architecture</title>
  <desc id="layers-desc">Vertical stack showing Ferridis layers L1 through L6. L1 Connections is the foundation; L6 Browser fallback is the top. Each layer is color-coded with its key technologies.</desc>

  <!-- Background -->
  <rect width="800" height="490" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="400" y="31" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,sans-serif"
        font-size="16" font-weight="700" letter-spacing="-0.3" fill="#0F172A">
    Ferridis — Six-layer architecture
  </text>
  <text x="400" y="51" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,sans-serif"
        font-size="11" fill="#94A3B8">
    Each layer has a clear purpose and a clean interface to the layers above and below
  </text>

  <!-- ═══════════════════════════════════════════════
       LAYER 6  —  Browser / computer-use   y=70
       ═══════════════════════════════════════════════ -->
  <rect x="50" y="70" width="720" height="58" rx="7" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
  <rect x="50" y="70" width="5"   height="58" rx="2.5" fill="#DC2626"/>
  <circle cx="88" cy="99" r="16" fill="#FEF2F2"/>
  <text x="88" y="104" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#DC2626">L6</text>
  <text x="116" y="92"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F172A">Browser / computer-use</text>
  <text x="116" y="111"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748B">Universal fallback · drives any UI without an API · tier-declared precedence</text>
  <!-- pills -->
  <rect x="554" y="87" width="58" height="20" rx="10" fill="#FEF2F2"/>
  <text x="583" y="101" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#DC2626">browser</text>
  <rect x="619" y="87" width="86" height="20" rx="10" fill="#FEF2F2"/>
  <text x="662" y="101" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#DC2626">computer-use</text>
  <rect x="712" y="87" width="48" height="20" rx="10" fill="#FEF2F2"/>
  <text x="736" y="101" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#DC2626">vision</text>

  <!-- ═══════════════════════════════════════════════
       LAYER 5  —  Intent layer   y=136
       ═══════════════════════════════════════════════ -->
  <rect x="50" y="136" width="720" height="58" rx="7" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
  <rect x="50" y="136" width="5"   height="58" rx="2.5" fill="#7C3AED"/>
  <circle cx="88" cy="165" r="16" fill="#F5F3FF"/>
  <text x="88" y="170" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#7C3AED">L5</text>
  <text x="116" y="158"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F172A">Intent layer</text>
  <text x="116" y="177"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748B">goal → capability routing · controlled vocabulary · confidence scoring</text>
  <!-- pills -->
  <rect x="524" y="153" width="74" height="20" rx="10" fill="#F5F3FF"/>
  <text x="561" y="167" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#7C3AED">intent verbs</text>
  <rect x="605" y="153" width="72" height="20" rx="10" fill="#F5F3FF"/>
  <text x="641" y="167" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#7C3AED">mesh lookup</text>
  <rect x="684" y="153" width="76" height="20" rx="10" fill="#F5F3FF"/>
  <text x="722" y="167" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#7C3AED">confidence</text>

  <!-- ═══════════════════════════════════════════════
       LAYER 4  —  Bidirectional channels   y=202
       ═══════════════════════════════════════════════ -->
  <rect x="50" y="202" width="720" height="58" rx="7" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
  <rect x="50" y="202" width="5"   height="58" rx="2.5" fill="#D97706"/>
  <circle cx="88" cy="231" r="16" fill="#FFFBEB"/>
  <text x="88" y="236" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#D97706">L4</text>
  <text x="116" y="224"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F172A">Bidirectional channels</text>
  <text x="116" y="243"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748B">SSE push · WebSocket bidi · Webhook delivery · consent-scoped subscriptions</text>
  <!-- pills -->
  <rect x="572" y="219" width="34" height="20" rx="10" fill="#FFFBEB"/>
  <text x="589" y="233" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#D97706">SSE</text>
  <rect x="613" y="219" width="72" height="20" rx="10" fill="#FFFBEB"/>
  <text x="649" y="233" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#D97706">WebSocket</text>
  <rect x="692" y="219" width="60" height="20" rx="10" fill="#FFFBEB"/>
  <text x="722" y="233" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#D97706">Webhook</text>

  <!-- ═══════════════════════════════════════════════
       LAYER 3  —  Web-native specs   y=268
       ═══════════════════════════════════════════════ -->
  <rect x="50" y="268" width="720" height="58" rx="7" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1"/>
  <rect x="50" y="268" width="5"   height="58" rx="2.5" fill="#0F766E"/>
  <circle cx="88" cy="297" r="16" fill="#F0FDFA"/>
  <text x="88" y="302" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#0F766E">L3</text>
  <text x="116" y="290"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F172A">Web-native specs</text>
  <text x="116" y="309"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748B">OpenAPI 3 · AsyncAPI 2.6 · JSON Schema — no new spec language invented</text>
  <!-- pills -->
  <rect x="528" y="285" width="68" height="20" rx="10" fill="#F0FDFA"/>
  <text x="562" y="299" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#0F766E">OpenAPI 3</text>
  <rect x="603" y="285" width="62" height="20" rx="10" fill="#F0FDFA"/>
  <text x="634" y="299" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#0F766E">AsyncAPI</text>
  <rect x="672" y="285" width="80" height="20" rx="10" fill="#F0FDFA"/>
  <text x="712" y="299" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#0F766E">JSON Schema</text>

  <!-- ═══════════════════════════════════════════════
       LAYER 2  —  Capability mesh   y=334
       ═══════════════════════════════════════════════ -->
  <rect x="50" y="334" width="720" height="58" rx="7" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
  <rect x="50" y="334" width="5"   height="58" rx="2.5" fill="#0369A1"/>
  <circle cx="88" cy="363" r="16" fill="#F0F9FF"/>
  <text x="88" y="368" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#0369A1">L2</text>
  <text x="116" y="356"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F172A">Capability mesh</text>
  <text x="116" y="375"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748B">Federated 3-tier registry · lazy manifest/schema · Sigstore signing</text>
  <!-- pills -->
  <rect x="540" y="351" width="60" height="20" rx="10" fill="#F0F9FF"/>
  <text x="570" y="365" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#0369A1">manifest</text>
  <rect x="607" y="351" width="80" height="20" rx="10" fill="#F0F9FF"/>
  <text x="647" y="365" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#0369A1">lazy schema</text>
  <rect x="694" y="351" width="62" height="20" rx="10" fill="#F0F9FF"/>
  <text x="725" y="365" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#0369A1">Sigstore</text>

  <!-- ═══════════════════════════════════════════════
       LAYER 1  —  Connections (foundation)   y=400
       ═══════════════════════════════════════════════ -->
  <rect x="50" y="400" width="720" height="58" rx="7" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="50" y="400" width="5"   height="58" rx="2.5" fill="#1D4ED8"/>
  <circle cx="88" cy="429" r="16" fill="#EFF6FF"/>
  <text x="88" y="434" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">L1</text>
  <text x="116" y="422"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F172A">Connections</text>
  <text x="116" y="441"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748B">OAuth 2.1+PKCE · OS-keychain wallet · typestate lifecycle · durable consent</text>
  <!-- pills -->
  <rect x="560" y="417" width="66" height="20" rx="10" fill="#EFF6FF"/>
  <text x="593" y="431" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#1D4ED8">OAuth 2.1</text>
  <rect x="633" y="417" width="38" height="20" rx="10" fill="#EFF6FF"/>
  <text x="652" y="431" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#1D4ED8">PKCE</text>
  <rect x="678" y="417" width="68" height="20" rx="10" fill="#EFF6FF"/>
  <text x="712" y="431" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#1D4ED8">typestate</text>

  <!-- Footer -->
  <text x="400" y="477" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#CBD5E1">
    L1 is the foundation · every layer above depends on it · MCP/A2A interop at Layer 1 + 2
  </text>
</svg>
