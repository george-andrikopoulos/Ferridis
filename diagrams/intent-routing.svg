<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 870 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ir-t">
  <title id="ir-t">Intent routing: intent verb normalised against controlled vocabulary, matched in manifest, full schema loaded on selection, resulting in capability call</title>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="870" height="130" fill="#F8FAFC"/>

  <!-- N1: intent verb -->
  <rect x="6" y="30" width="112" height="70" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="62" y="58" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="600" fill="#0F172A">intent verb</text>
  <text x="62" y="75" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-style="italic" fill="#64748B">send-message</text>

  <!-- C1: NORMALISED AGAINST -->
  <line x1="119" y1="65" x2="180" y2="65" stroke="#CBD5E1" stroke-width="1" marker-end="url(#a)"/>
  <text x="149" y="45" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" letter-spacing="0.05em" fill="#94A3B8">NORMALISED</text>
  <text x="149" y="55" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" letter-spacing="0.05em" fill="#94A3B8">AGAINST</text>

  <!-- N2: controlled vocabulary -->
  <rect x="182" y="30" width="130" height="70" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="247" y="54" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#0F172A">controlled</text>
  <text x="247" y="67" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#0F172A">vocabulary</text>
  <text x="247" y="82" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#64748B">35 canonical verbs</text>

  <!-- C2: MATCHED IN -->
  <line x1="313" y1="65" x2="373" y2="65" stroke="#CBD5E1" stroke-width="1" marker-end="url(#a)"/>
  <text x="343" y="50" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" letter-spacing="0.05em" fill="#94A3B8">MATCHED IN</text>

  <!-- N3: manifest (orange left accent) -->
  <rect x="375" y="30" width="140" height="70" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="375" y="30" width="4" height="70" rx="2" fill="#F0883E"/>
  <text x="447" y="57" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#0F172A">manifest</text>
  <text x="447" y="71" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#64748B">&#x2264;200 tokens</text>
  <text x="447" y="85" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#64748B">always loaded</text>

  <!-- C3: SELECTED → FETCH -->
  <line x1="516" y1="65" x2="577" y2="65" stroke="#CBD5E1" stroke-width="1" marker-end="url(#a)"/>
  <text x="546" y="45" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" letter-spacing="0.05em" fill="#94A3B8">SELECTED</text>
  <text x="546" y="55" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" letter-spacing="0.05em" fill="#94A3B8">&#x2192; FETCH</text>

  <!-- N4: full schema (blue left accent) -->
  <rect x="579" y="30" width="150" height="70" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="579" y="30" width="4" height="70" rx="2" fill="#3B82F6"/>
  <text x="657" y="54" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#0F172A">full schema</text>
  <text x="657" y="68" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#64748B">OpenAPI / AsyncAPI</text>
  <text x="657" y="82" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#64748B">loaded on demand</text>

  <!-- C4: plain arrow -->
  <line x1="730" y1="65" x2="756" y2="65" stroke="#CBD5E1" stroke-width="1" marker-end="url(#a)"/>

  <!-- N5: capability call (blue bg) -->
  <rect x="758" y="30" width="106" height="70" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="811" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#1D4ED8">capability call</text>
</svg>
