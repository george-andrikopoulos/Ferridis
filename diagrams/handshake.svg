<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hs-title hs-desc">
  <title id="hs-title">Ferridis — Connection handshake (OAuth)</title>
  <desc id="hs-desc">Sequence diagram showing the 8-step OAuth 2.1 handshake between Runtime, Connection Broker, and Service to establish a Ferridis connection.</desc>

  <!-- Background -->
  <rect width="780" height="540" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="390" y="28" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,sans-serif"
        font-size="15" font-weight="700" letter-spacing="-0.3" fill="#0F172A">Connection handshake — OAuth 2.1+PKCE</text>
  <text x="390" y="46" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94A3B8">
    Establishing a durable, consent-based connection between a runtime and a service
  </text>

  <!-- ─────────────────────────────────────────────
       PARTICIPANTS   (x positions of lifelines)
       RT = 130,  CB = 390,  SV = 650
       ───────────────────────────────────────────── -->

  <!-- Participant boxes -->
  <!-- Runtime -->
  <rect x="60"  y="60" width="140" height="40" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="130" y="76" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#1D4ED8">Runtime</text>
  <text x="130" y="91" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#3B82F6">ferridis-client</text>

  <!-- Connection Broker -->
  <rect x="310" y="60" width="160" height="40" rx="6" fill="#F0FFF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="390" y="76" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#166534">Connection Broker</text>
  <text x="390" y="91" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#16A34A">ferridis-protocol</text>

  <!-- Service -->
  <rect x="580" y="60" width="140" height="40" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2"/>
  <text x="650" y="76" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#9A3412">Service</text>
  <text x="650" y="91" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#EA580C">Google Calendar, Slack…</text>

  <!-- Lifelines -->
  <line x1="130" y1="100" x2="130" y2="510" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="390" y1="100" x2="390" y2="510" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="650" y1="100" x2="650" y2="510" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ─────────────────────────────────────────────
       MESSAGES
       Each row: label_y = midpoint text, arrow_y = arrow line
       ───────────────────────────────────────────── -->

  <!-- Step spacing: start y=130, step=52 -->

  <!-- 1. RT → CB: POST /connect -->
  <line x1="134" y1="132" x2="386" y2="132" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="180" y="117" width="162" height="18" rx="3" fill="#F8FAFC"/>
  <text x="261" y="129" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#1D4ED8">POST /connect {capability}</text>
  <text x="54" y="136" text-anchor="end"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748B" font-weight="600">1</text>

  <!-- 2. CB → SV: fetch manifest -->
  <line x1="394" y1="184" x2="646" y2="184" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="446" y="169" width="104" height="18" rx="3" fill="#F8FAFC"/>
  <text x="498" y="181" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#166534">fetch manifest</text>
  <text x="54" y="188" text-anchor="end"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748B" font-weight="600">2</text>

  <!-- 3. SV → CB: manifest.json (dashed return) -->
  <line x1="646" y1="210" x2="394" y2="210" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-grey)"/>
  <rect x="440" y="196" width="104" height="18" rx="3" fill="#F8FAFC"/>
  <text x="492" y="208" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#6B7280">manifest.json</text>

  <!-- 3→4 label -->
  <text x="54" y="214" text-anchor="end"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748B" font-weight="600">3</text>

  <!-- 4. CB → RT: {auth_url, state} -->
  <line x1="386" y1="236" x2="134" y2="236" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-grey)"/>
  <rect x="170" y="222" width="142" height="18" rx="3" fill="#F8FAFC"/>
  <text x="241" y="234" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#6B7280">{auth_url, state}</text>
  <text x="54" y="240" text-anchor="end"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748B" font-weight="600">4</text>

  <!-- 5. RT → SV: open browser → auth_url -->
  <line x1="134" y1="288" x2="646" y2="288" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="278" y="273" width="184" height="18" rx="3" fill="#F8FAFC"/>
  <text x="370" y="285" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#1D4ED8">open browser → auth_url</text>
  <text x="54" y="292" text-anchor="end"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748B" font-weight="600">5</text>

  <!-- "user consents" annotation -->
  <rect x="570" y="294" width="88" height="16" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="0.8"/>
  <text x="614" y="305" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#713F12">user consents</text>

  <!-- 6. SV → RT: OAuth callback -->
  <line x1="646" y1="320" x2="134" y2="320" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-grey)"/>
  <rect x="246" y="306" width="158" height="18" rx="3" fill="#F8FAFC"/>
  <text x="325" y="318" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#6B7280">OAuth callback → code</text>
  <text x="54" y="324" text-anchor="end"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748B" font-weight="600">6</text>

  <!-- 7. RT → CB: POST /exchange {state, code} -->
  <line x1="134" y1="372" x2="386" y2="372" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="148" y="357" width="186" height="18" rx="3" fill="#F8FAFC"/>
  <text x="241" y="369" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#1D4ED8">POST /exchange {state, code}</text>
  <text x="54" y="376" text-anchor="end"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748B" font-weight="600">7</text>

  <!-- CB → SV: token exchange -->
  <line x1="394" y1="398" x2="646" y2="398" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="440" y="384" width="110" height="18" rx="3" fill="#F8FAFC"/>
  <text x="495" y="396" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#166534">token exchange</text>

  <!-- SV → CB: access_token + refresh_token -->
  <line x1="646" y1="424" x2="394" y2="424" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-grey)"/>
  <rect x="404" y="410" width="196" height="18" rx="3" fill="#F8FAFC"/>
  <text x="502" y="422" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#6B7280">access_token + refresh_token</text>

  <!-- 8. CB → RT: {connection_id, expires_at} — stored in wallet -->
  <line x1="386" y1="466" x2="134" y2="466" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-grey)"/>
  <rect x="148" y="452" width="196" height="18" rx="3" fill="#F8FAFC"/>
  <text x="246" y="464" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="10" fill="#6B7280">{connection_id, expires_at}</text>
  <text x="54" y="470" text-anchor="end"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748B" font-weight="600">8</text>

  <!-- "stored in OS keychain wallet" annotation -->
  <rect x="34" y="476" width="158" height="16" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
  <text x="113" y="487" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#1D4ED8">stored in OS-keychain wallet</text>

  <!-- Footer -->
  <text x="390" y="522" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#CBD5E1">
    Tokens never sent to the model · TLS 1.3+ throughout · granular per-connection revocation
  </text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1D4ED8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#166534"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
