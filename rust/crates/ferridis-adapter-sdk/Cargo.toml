[package]
name = "ferridis-adapter-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Framework for building Ferridis adapters. Trait-based publisher side: implement Capability, the SDK serves the manifest and dispatches calls."

[dependencies]
ferridis-core = { workspace = true }
ferridis-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
time = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
jsonschema = { workspace = true }
tracing = { workspace = true }
async-stream = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
