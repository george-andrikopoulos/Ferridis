[package]
name = "ferridis-adapter-slack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Slack reference adapter for Ferridis — canonical messaging example. Exposes channels, messages, and users as Ferridis intents."

[dependencies]
ferridis-core = { workspace = true }
ferridis-adapter-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
axum = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }

# Unique target name so the example does not collide with the other adapters'
# `serve` examples on a workspace-wide build (cargo issue #6313 — same output
# filename is a hard error on Windows link.exe).
[[example]]
name = "serve-slack"
path = "examples/serve.rs"
