[package]
name = "ferridis-adapter-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GitHub reference adapter for Ferridis — the canonical developer-tool example. Exposes repos, files, issues, pull requests, and code search as Ferridis intents."

[dependencies]
ferridis-core = { workspace = true }
ferridis-adapter-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
base64 = "0.22"
tokio = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
axum = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }

# Unique target name so the example does not collide with the other adapters'
# `serve` examples on a workspace-wide build (cargo issue #6313 — same output
# filename is a hard error on Windows link.exe).
[[example]]
name = "serve-github"
path = "examples/serve.rs"
